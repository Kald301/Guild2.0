# Name: Permisos de trampa del servidor §7* (Server Cheat Permissions)
# Description: Elija quién puede usar el modo trampa JEI en este servidor. §7* (Choose who can use JEI cheat mode on this server.)
[permissions]
	# Name: Permitir el modo trampa para los operadores §7* (Allow Cheat Mode for Operators)
	# Description: Permitir que los jugadores con estado de operador (/op) utilicen el modo trampa JEI. §7* (Allow players with operator status (/op) to use JEI cheat mode.)
	# Valid Values: [true, false]
	# Default Value: true
	enableCheatModeForOp = true

	# Name: Permitir el modo trampa en el modo creativo §7* (Allow Cheat Mode in Creative Mode)
	# Description: Permitir que los jugadores en modo creativo usen el modo trampa JEI. §7* (Allow players in Creative Mode to use JEI cheat mode.)
	# Valid Values: [true, false]
	# Default Value: true
	enableCheatModeForCreative = true

	# Name: Permitir el modo trampa con dar permiso §7* (Allow Cheat Mode with Give Permission)
	# Description: Permita que los jugadores que puedan usar el comando /give usen el modo trampa JEI. §7* (Allow players who can use the /give command to use JEI cheat mode.)
	# Valid Values: [true, false]
	# Default Value: false
	enableCheatModeForGive = false


