#.
#Configure nodes spawn.
[worldgen]
	#.
	#.
	#Whether Create Re-Automated should generate nodes in the world.
	enabled = true

	#.
	#Copper nodes specific configs.
	[worldgen.copper]
		#.
		#.
		# Default: 3
		# Range: 0 ~ 6
		faces = 3
		#.
		# Default: 30
		# Range: 0 ~ 512
		tries = 30
		#.
		# Default: -16
		# Range: > -2147483648
		fromY = -16
		#.
		# Default: 64
		# Range: > -2147483648
		toY = 64

	#.
	#Zinc nodes specific configs.
	[worldgen.zinc]
		#.
		#.
		# Default: 3
		# Range: 0 ~ 6
