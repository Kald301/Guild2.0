#SwemCull - faster rendering for SWEM horses.
#Client-side and rendering only: it never changes how horses behave.
#Most of this can also be changed in game with /swemcull.
[general]
	#Master switch. When false, SwemCull does nothing at all.
	enabled = true
	#Show a short message in chat after installing or updating.
	showWelcome = true
	#Used to show the update message only once. Clear it to see it again.
	lastSeenVersion = "1.1.0"

#Distance culling: horses further away than this are not drawn.
#The horse you ride, lead or look at is never culled.
[culling]
	#Enable distance culling.
	enabled = true
	#Horses further than this many blocks from the camera are not drawn.
	#Minecraft stops drawing horses at about 94 blocks on its own, so values
	#at or above that have no effect.
	# Default: 80
	# Range: 8 ~ 512
	distance = 80
	#Horses carrying a player stay visible this far instead, so other riders
	#do not vanish across a field. They still lose detail at the normal distances.
	# Default: 92
	# Range: 8 ~ 512
	riddenDistance = 92
	#Never cull a horse that is carrying a player. The rider is drawn
	#separately, so hiding the horse would leave them floating in mid-air.
	neverCullRidden = true

#Tack stripping: beyond this distance small tack is hidden, and the horse itself
#still renders. Tack is the most expensive part of a SWEM horse to draw.
[stripping]
	#Enable tack stripping.
	enabled = true
	#Horses further than this many blocks from the camera lose their tack.
	# Default: 24
	# Range: 4 ~ 512
	distance = 24

	#Which parts can be hidden. Each one notes the distance it uses.
	#Saddles, wing tips, mane, tail hair and forelock go at detail.distance, so a
	#horse does not look bare the moment its bridle goes. The blanket, wraps and
	#armour are off by default: they are what still shows a horse is dressed.
	[stripping.groups]
		#Hide saddles (12 bones, detail distance).
		saddles = true
		#Hide bridles (18 bones, tack distance).
		bridles = true
		#Hide halter (4 bones, tack distance).
		halter = true
		#Hide blanket (6 bones, detail distance).
		blanket = false
		#Hide pastureBlanket (4 bones, tack distance).
		pastureBlanket = true
		#Hide girthStrap (2 bones, tack distance).
		girthStrap = true
		#Hide legWraps (4 bones, tack distance).
		legWraps = false
		#Hide earNet (4 bones, tack distance).
		earNet = true
		#Hide bodyWrap (1 bones, tack distance).
		bodyWrap = false
		#Hide legWrapHooves (4 bones, tack distance).
		legWrapHooves = true
		#Hide breastCollar (9 bones, tack distance).
		breastCollar = true
		#Hide saddleBags (4 bones, tack distance).
		saddleBags = true
		#Hide armor (12 bones, tack distance).
		armor = false
		#Hide wings (10 bones, detail distance).
		wings = false
		#Hide wingTip (2 bones, detail distance).
		wingTip = true
		#Hide trimEars (2 bones, far distance).
		trimEars = true
		#Hide trimLowerLegs (4 bones, far distance).
		trimLowerLegs = false
		#Hide trimKnees (6 bones, far distance).
		trimKnees = false
		#Hide mane (20 bones, detail distance).
		mane = true
		#Hide tailHair (8 bones, detail distance).
		tailHair = true
		#Hide forelock (1 bones, detail distance).
		forelock = true
		#Hide farBelly (1 bones, far distance).
		farBelly = true
		#Hide farBreast (2 bones, far distance).
		farBreast = true
		#Hide farFace (3 bones, far distance).
		farFace = true
		#Hide farHooves (4 bones, far distance).
		farHooves = true
		#Hide farTailDock (1 bones, far distance).
		farTailDock = true

#Mane and tail: beyond this distance the mane, forelock and tail hair are hidden.
#The horse still renders and animates.
[detail]
	#Enable the mane and tail step.
	enabled = true
	#Horses further than this many blocks lose mane and tail hair.
	# Default: 36
	# Range: 4 ~ 512
	distance = 36

#Small parts: beyond this distance the ears, hooves, lower lip, chest, belly
#and tail dock are hidden. None of them change the outline, so by default this
#comes before the mane and tail step.
[far]
	#Enable the small parts step.
	enabled = true
	#Horses further than this lose their small and internal parts.
	# Default: 30
	# Range: 4 ~ 512
	distance = 30

#Optimisations that apply at every distance, including right next to a horse.
#Unless noted, they change nothing you can see. Turn one off to compare.
[optimisations]
	#Find model parts with a lookup table instead of searching the whole
	#model, which SWEM does about 95 times per horse per frame.
	fastBoneLookup = true
	#Skip model parts that are hidden. Without this a hidden part costs as
	#much as a visible one, and a horse with no tack has about 95 of them.
	skipHiddenBones = true
	#Do not draw horses outside your view. SWEM for 1.21.1 turns Minecraft's
	#own check off for its horses, so every horse behind you is drawn. This
	#puts the check back, sized to the whole model including the wings.
	#SWEM for 1.20.1 keeps the check, so there this changes nothing.
	frustumCulling = true
	#Remember which texture each part of a horse uses instead of working it
	#out again every frame. It only changes when the horse's coat, tack or
	#armour does. Turn off if a texture ever looks wrong.
	cacheTextures = true
	#Do not draw horses hidden behind solid blocks, such as a barn full of
	#horses seen from outside. Only horses more than 6 blocks away are checked.
	#Glass, fences, gates, trapdoors and slabs never count as walls.
	#EntityCulling does not do this for SWEM horses. Turn off if a horse ever
	#appears late as you come round a corner.
	occlusionCulling = true
	#With a shaderpack, leave small tack out of horses' shadows. Bridles,
	#reins and straps are too thin to show in a shadow map anyway; saddles,
	#blankets, manes and tails stay. Does nothing without shaders.
	shadowPassLod = true
	#Draw each horse in about ten draw calls instead of about a hundred.
	#Measured 50 -> 78 fps with 32 tacked horses on screen. Switches itself off
	#when ImmediatelyFast or a shaderpack already does the same.
	batchDrawCalls = true
	#Animate horses beyond the mane and tail distance 20 times a second
	#instead of every frame (beyond 12 blocks while far pictures are on).
	#Measured 185 -> 285 fps with 32 tacked horses at 40 blocks.
	animationReplay = true
	#With a shaderpack, work out each horse's animation once per frame instead
	#of once for the shadow and again for the screen.
	animationReuseShadow = true
	#Keep detail on horses you zoom in on with a spyglass or a zoom mod.
	#Every distance is multiplied by the zoom, so at 4x a horse 96 blocks away
	#is treated like one at 24. Works with any zoom mod, including scroll zoom.
	zoomDetail = true
	#Show SWEM's horse poop on Xaero's Minimap and World Map. Off by default: a pile
	#of poop on the map is clutter. When on, it gets a poop icon instead of the
	#broken one Xaero's draws from its model. Does nothing without Xaero's.
	minimapHorsePoop = false
	#Draw SWEM's horse poop cheaply: piles behind you, off screen or behind walls are
	#skipped, and every pile you can see is drawn from one copy instead of each through
	#GeckoLib, as far away as horses are. SWEM draws every pile in range every frame,
	#and piles never go away.
	poopCulling = true
	#Fade tack and detail out over the last few blocks before they are hidden,
	#instead of having them disappear at once. Needs batchDrawCalls.
	fadeDetail = true
	#Draw far horses as a picture of themselves, retaken many times a second, with
	#their name tag and leash drawn as normal. Ridden, winged and hurt horses and foals
	#are always drawn as models, and so is everything with shaders.
	farPictures = true
	#How far away, in blocks, a standing horse becomes a picture. Pictures keep every
	#piece of tack, so from here on a standing horse never loses any.
	# Default: 24
	# Range: 16 ~ 256
	farPictureDistance = 24

#Adaptive quality: shortens every distance above when horses pull your framerate
#below the target, and restores them when it recovers. Off by default because it
#changes what you see while you play.
[adaptive]
	#Enable adaptive quality.
	enabled = false
	#Framerate to aim for. Distances never shrink below 45% of their set value,
	#and it settles rather than adjusting constantly. It does nothing when fewer
	#than 3 horses are on screen or your framerate is already at its cap.
	# Default: 60
	# Range: 15 ~ 480
	targetFps = 60
	#Show an overlay with how many horses are drawn in full, reduced or skipped.
	#Toggle in game with /swemcull overlay. Hidden while F1 or F3 is open.
	overlay = false
