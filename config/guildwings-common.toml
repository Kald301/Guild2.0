#Parte 1: daño por velocidad de impacto mientras se vuela o se planea con alas de Fantastic Wings
#(poción o Arnés de alas). Funciona como el choque con Elytra vanilla: duele chocar rápido de frente
#contra bloques; aterrizar siguiendo la trayectoria no.
#La velocidad se mide con el movimiento real que reporta el cliente, por eje (X, Y, Z).
#Daño = (pérdida de velocidad - impact_safe_velocity) x 10 x impact_damage_multiplier.
#El tipo de daño (guildwings:wing_impact) se comporta como fly_into_wall: ignora la armadura,
#Feather Falling no lo reduce y Protección sí.
[fall_damage]
	#Interruptor general de la Parte 1. En false no se aplica ningún daño por impacto.
	habilitado = true
	#Pérdida de velocidad (bloques/tick) a partir de la cual un choque empieza a doler.
	#0.3 bloques/tick = ~6 bloques/s, el mismo umbral que la Elytra vanilla. A calibrar en pruebas.
	# Default: 0.3
	# Range: 0.0 ~ 10.0
	impact_safe_velocity = 0.6
	#Escala el daño resultante. 1.0 = igual que la Elytra vanilla.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	impact_damage_multiplier = 1.0
	#Tope de daño por impacto, en puntos de vida (2 = 1 corazón), antes de Protección.
	#-1 (o cualquier valor <= 0) = sin tope: el daño escala libremente con la velocidad.
	# Default: -1.0
	# Range: -1.0 ~ 1024.0
	impact_damage_max_cap = -1.0
	#Impide el golpe en picada de la Maza mientras se vuela o se planea con alas.
	#Hoy es REDUNDANTE a propósito: Guild Wings no toca fallDistance y Fantastic Wings la deja en ~0
	#mientras se vuela o se planea, así que la Maza ya no puede activarse (necesita fallDistance > 1.5).
	#Queda explícito para documentar el comportamiento y para seguir bloqueando el combo si algún día
	#se restaurara fallDistance.
	bloquear_maza_planeando = true
	#Para calibrar: en cada contacto nuevo contra un bloque mientras se vuela o se planea, le muestra al
	#jugador en el chat la velocidad previa por eje, la pérdida (b/t y b/s), el umbral y el daño calculado,
	#aunque el daño sea 0. Dejar en false en el server real.
	debug_impacto = false
	#Un salto o una caída corta no es planear. Fantastic Wings frena cualquier caída con alas, incluso la
	#de un salto común, así que sin vuelo activo el impacto cuenta recién cuando el jugador cayó MÁS de
	#estos bloques desde que dejó el suelo (la misma cuenta que la distancia de caída vanilla; subir no
	#descuenta), o si voló en ese mismo tramo en el aire. El vuelo activo cuenta siempre.
	#3 = la altura a partir de la cual vanilla hace daño por caída. 0 = cuenta en cuanto empieza a caer.
	# Default: 3.0
	# Range: 0.0 ~ 256.0
	planeo_caida_minima = 3.0

#Parte 3: Arnés de alas equipable en Curios (slot "wings").
#El costo de la receta NO está acá: se ajusta con el JSON de la receta (datapack o KubeJS).
[wing_harness]
	#Si es false, el arnés no otorga alas y sus recetas no se cargan (hace falta /reload para las recetas).
	habilitado = true

#Parte 2: las alas de POCIÓN duran un tiempo. Al tomar una poción de alas de Fantastic Wings (también
#la arrojadiza, la persistente o la flecha) el jugador recibe el efecto "Alas" con esta duración; el
#tiempo corre siempre (volando, planeando o caminando) y se ve como cualquier efecto. Cuando termina,
#las alas se pierden (no hay recarga: hace falta otra poción). Volver a tomarla renueva la duración.
#La leche quita el efecto (y con él las alas); el tótem de la inmortalidad no.
#El Arnés de alas NO tiene límite de tiempo: solo el costo de hambre de Fantastic Wings
#(fantasticwings-server.toml).
[wing_potion]
	#Si es false, las alas de poción vuelven a ser permanentes, como en Fantastic Wings original.
	habilitado = true
	#Duración del efecto "Alas" de una poción, en segundos. 300 = 5 minutos.
	#Un cambio se aplica a las pociones que se tomen después, no a los efectos que ya están corriendo.
	# Default: 300
	# Range: 1 ~ 86400
	duracion_segundos = 300
